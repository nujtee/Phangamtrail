<style>
:root{--g:#1f5f3f;--g2:#2f7d52;--g3:#e7f1ea;--bg:#f4f6f1;--card:#fff;--ink:#1d2a22;--mut:#6b776f;--line:#e1e6df;--warn:#a96a12;--warnbg:#fdf3e1;--red:#b83227;--redbg:#fbe9e7;--blue:#2b5f9e;--bluebg:#e6effa;--okbg:#e3f3e8}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
a{color:var(--g2)}
.topbar{background:var(--g);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand small{font-weight:400;opacity:.75;font-size:12px}
.topnav{display:flex;gap:4px;flex-wrap:wrap}
.topnav a{color:#dfeee4;text-decoration:none;padding:6px 12px;border-radius:999px;font-size:14px}
.topnav a.on{background:rgba(255,255,255,.18);color:#fff}
.topnav a.cta{background:#f0b54d;color:#3b2a06;font-weight:600}.topnav a.cta.on{background:#ffd27a;color:#3b2a06}
.navsub{display:flex;gap:2px;margin-left:6px;padding-left:6px;border-left:1px solid rgba(255,255,255,.25)}.navsub a{font-size:12.5px!important;opacity:.85}
@media(max-width:800px){.topnav{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px}.topnav a{white-space:nowrap}}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.gal figure{margin:0;position:relative;border-radius:10px;overflow:hidden;background:#e9ece8;aspect-ratio:4/3;cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:12px;padding:14px 8px 5px}
.gal .del{position:absolute;top:5px;right:5px}
.stay{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;padding:0;overflow:hidden}
.stay .ph{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:3px;background:#e9ece8}.stay .ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:pointer}.stay .ph img:first-child{grid-column:1/-1;aspect-ratio:16/9}
.stay .bd{padding:18px}
@media(max-width:760px){.stay{grid-template-columns:1fr}}
.org{display:flex;flex-direction:column;align-items:center;min-width:max-content;margin:0 auto}
.org ul{display:flex;justify-content:center;padding:14px 0 0;margin:0;list-style:none;position:relative;flex-wrap:nowrap}
.org ul ul::before{content:'';position:absolute;top:0;left:50%;height:14px;border-left:2px solid #b9cbbf}
.org li{display:flex;flex-direction:column;align-items:center;position:relative;padding:14px 6px 0}
.org li::before{content:'';position:absolute;top:0;left:50%;height:14px;border-left:2px solid #b9cbbf}
.org li::after{content:'';position:absolute;top:0;left:0;right:0;border-top:2px solid #b9cbbf}
.org li:first-child::after{left:50%}.org li:last-child::after{right:50%}.org li:only-child::after{display:none}
.org>ul{padding-top:0}.org>ul>li{padding-top:0}.org>ul>li::before,.org>ul>li::after{display:none}
.org .node{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center;width:140px}
.org .node img{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px;border:3px solid var(--g3)}
.org .node b{display:block;font-size:14px}.org .node span{font-size:12.5px;color:var(--g2);font-weight:600}

<script>
/* ========== utils ========== */

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const baht=n=>'฿'+Number(n||0).toLocaleString('th-TH');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const nowISO=()=>new Date().toISOString();
const fmtDate=s=>new Date(s+'T00:00:00').toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const fmtDateS=s=>new Date(s+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short'});
const fmtDT=iso=>iso?new Date(iso).toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'-';
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const weekRange=t=>{const d=new Date(t+'T00:00:00');const s=addDays(t,-((d.getDay()+6)%7));return[s,addDays(s,6)]};
const monthRange=t=>{const[y,m]=t.split('-').map(Number);return[`${y}-${pad(m)}-01`,`${y}-${pad(m)}-${pad(new Date(y,m,0).getDate())}`]};
const inR=(d,r)=>d>=r[0]&&d<=r[1];
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}

/* ========== PromptPay (EMVCo) ========== */
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function promptpayPayload(id,amount){
  const t=String(id).replace(/\D/g,'');const f=(k,v)=>k+pad(v.length)+v;
  let tag,val;
  if(t.length>=15){tag='03';val=t}else if(t.length>=13){tag='02';val=t}else{tag='01';val=('0000000000000'+t.replace(/^0/,'66')).slice(-13)}
  const p=f('00','01')+f('01',amount?'12':'11')+f('29',f('00','A000000677010111')+f(tag,val))+f('58','TH')+f('53','764')+(amount?f('54',Number(amount).toFixed(2)):'')+'6304';
  return p+crc16(p);
}

/* ========== roles & pages ========== */
const ROLES={
  superadmin:{label:'ผู้ดูแลระบบสูงสุด',pages:['dashboard','calendar','content','bookings','guides','accounting','payouts','payments','notifications','users','settings','audit']},
  admin:{label:'ผู้ดูแลระบบ',pages:['dashboard','calendar','content','bookings','guides','accounting','payouts','payments','notifications','settings','audit']},
  finance:{label:'เจ้าหน้าที่บัญชี/การเงิน',pages:['dashboard','calendar','bookings','accounting','payouts','payments','audit']},
  guidemgr:{label:'ผู้จัดการไกด์',pages:['dashboard','calendar','bookings','guides','notifications','audit']},
  staff:{label:'เจ้าหน้าที่ประสานงาน',pages:['dashboard','calendar','content','bookings','guides','notifications']},
  guide:{label:'ไกด์',pages:['mytrips']}
};
const PAGES={content:'🌐 จัดการเนื้อหาเว็บไซต์',calendar:'📅 ปฏิทิน',payments:'💳 ช่องทางรับชำระเงิน',dashboard:'📊 แดชบอร์ด',bookings:'📋 รายการจอง',guides:'🧭 มอบหมายงานไกด์',mytrips:'🥾 งานของฉัน',accounting:'💰 บัญชีรายรับ',payouts:'🏦 เบิกจ่ายไกด์',notifications:'🔔 การแจ้งเตือน',users:'👥 จัดการผู้ใช้',settings:'⚙️ ตั้งค่าราคา/ระบบ',audit:'🗂️ บันทึกการใช้งาน'};
const PERM={
  confirmPay:['superadmin','admin','finance'],
  assign:['superadmin','admin','guidemgr','staff'],
  markUnavail:['superadmin','admin','guidemgr'],
  cancel:['superadmin','admin','staff'],
  tripAdmin:['superadmin','admin','guidemgr'],
  payout:['superadmin','admin','finance'],
  payoutUndo:['superadmin'],
  editGuides:['superadmin','admin','guidemgr','staff'],
};
const me=()=>DB?.me||null;
const can=a=>{const u=me();return !!u&&PERM[a].includes(u.role)};

/* ========== data (มาจากเซิร์ฟเวอร์) ========== */
let DB=null,PUB=null,AUTH={hasUsers:true},booted=false;
function ph(label,hue,w=800,h=600){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 800 600"><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${hue},55%,78%)"/><stop offset="1" stop-color="hsl(${hue},45%,92%)"/></linearGradient></defs><rect width="800" height="600" fill="url(#a)"/><path d="M0 600 L180 300 L300 430 L470 200 L800 600Z" fill="hsl(${(hue+120)%360},30%,38%)"/><path d="M0 600 L260 420 L420 520 L620 380 L800 600Z" fill="hsl(${(hue+120)%360},35%,28%)"/><text x="400" y="110" font-family="sans-serif" font-size="40" fill="#fff" text-anchor="middle" opacity=".95">${label}</text><text x="400" y="160" font-family="sans-serif" font-size="22" fill="#fff" text-anchor="middle" opacity=".8">รูปตัวอย่าง</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function avatar(t,hue){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="120" height="120" fill="hsl(${hue},40%,82%)"/><circle cx="60" cy="46" r="22" fill="hsl(${hue},30%,55%)"/><path d="M18 118c4-26 22-38 42-38s38 12 42 38z" fill="hsl(${hue},30%,55%)"/></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
async function api(path,opt={}){
  try{const r=await fetch(path,{credentials:'same-origin',...opt,headers:{...(opt.body&&!(opt.body instanceof FormData)&&typeof opt.body==='string'?{'content-type':'application/json'}:{}),...(opt.headers||{})}});
    const j=await r.json().catch(()=>({error:'เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง'}));return {ok:r.ok,status:r.status,...j}}
  catch(e){return {ok:false,status:0,error:'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต'}}}
const post=(path,body)=>api(path,{method:'POST',body:JSON.stringify(body||{})});
async function loadPub(){const r=await api('/api/public/state');if(r.ok)PUB=r;return r.ok}
async function loadAdmin(){const r=await api('/api/admin/state');DB=r.ok?r:null;return r.ok}
/* คำสั่งหลังบ้าน: ส่งไปเซิร์ฟเวอร์ → ได้สถานะใหม่ → แสดงผล */
let DIRTY=false;
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('form[data-form]'))DIRTY=true},true);
document.addEventListener('change',e=>{if(e.target.closest&&e.target.closest('form[data-form]'))DIRTY=true},true);
window.addEventListener('hashchange',()=>{DIRTY=false});
async function call(name,p){
  const r=await post('/api/admin/'+name,p);
  if(r.status===401){DB=null;render();toast('กรุณาเข้าสู่ระบบใหม่');return null}
  if(!r.ok){toast(r.error||'ทำรายการไม่สำเร็จ');return null}
  DIRTY=false;DB=r.state;if(r.msg)toast(r.msg);await loadPub();render();return r}
async function uploadImg(dataURL){const blob=await (await fetch(dataURL)).blob();
  const r=await api('/api/admin/upload',{method:'POST',body:blob,headers:{'content-type':blob.type||'image/jpeg'}});if(!r.ok){toast(r.error||'อัปโหลดไม่สำเร็จ');return null}return r.url}
const gObj=(db,id)=>db.guides.find(g=>g.id===id);
const gName=(db,id)=>{const g=gObj(db,id);return g?`${g.firstName} ${g.lastName}`:'-'};
const PAX=[['ta','คนไทย ผู้ใหญ่'],['tc','คนไทย เด็ก'],['fa','ชาวต่างชาติ ผู้ใหญ่'],['fc','ชาวต่างชาติ เด็ก']];
const paxCount=p=>PAX.reduce((a,[k])=>a+(+p[k]||0),0);
const entryOf=(p,r)=>PAX.reduce((a,[k])=>a+(+p[k]||0)*(+r[k]||0),0);
const paxText=p=>PAX.filter(([k])=>+p[k]).map(([k,l])=>`${l} ${p[k]}`).join(' · ');
const activeGuides=db=>db.guides.filter(g=>g.active).sort((a,b)=>a.priority-b.priority);
function guideBusy(db,gid,date,time,exceptId){const dur=db.settings.tripHours*60,st=toMin(time);
  return db.bookings.some(b=>b.id!==exceptId&&b.guideId===gid&&b.status!=='cancelled'&&b.trip!=='paidcancel'&&b.date===date&&Math.abs(toMin(b.time)-st)<dur)}
const unavailOn=(db,gid,date)=>(db.unavail||[]).some(u=>u.guideId===gid&&u.date===date);
const guideDayCount=(db,gid,date,exceptId)=>db.bookings.filter(b=>b.id!==exceptId&&b.guideId===gid&&b.status!=='cancelled'&&b.trip!=='paidcancel'&&b.date===date).length;
function guideBlocked(db,gid,date,time,exceptId,b){const cap=+db.settings.maxGroupsPerGuideDay||0;return (cap>0&&guideDayCount(db,gid,date,exceptId)>=cap)||guideBusy(db,gid,date,time,exceptId)||unavailOn(db,gid,date)||!!(b&&(b.declined||[]).some(d=>d.guideId===gid))}
const dayBookings=(db,date)=>db.bookings.filter(b=>b.date===date&&b.status!=='cancelled').sort((a,b)=>(a.qn??1e9)-(b.qn??1e9)||a.createdAt.localeCompare(b.createdAt));
const dayGuides=(db,date)=>activeGuides(db).filter(g=>!unavailOn(db,g.id,date));
